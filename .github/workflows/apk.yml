# Gera o APK do Lookbook (Android) a cada atualização na main.
# O endereço do servidor da IA vem da variável do repositório API_URL (Settings > Secrets and variables > Actions > Variables).
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar o app web
        env:
          API_URL: ${{ vars.API_URL }}
          APP_CODE: ${{ vars.APP_CODE }}
        run: |
          python3 tools/build.py
          rm -rf www && mkdir www && cp -r public/* www/
          rm -f www/sw.js
          echo "window.LOOKBOOK_CONFIG = {apiBase: \"${API_URL:-https://lookbook-app-zcq4.onrender.com}\", appCode: \"${APP_CODE:-lookbook}\", aiOnDemand: true, noAI: true};" > www/config.js

      - name: Criar projeto Android (Capacitor)
        run: |
          mkdir -p cap && cd cap
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3 @capacitor/filesystem@7 @capacitor/share@7
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "app.lookbook.guardaroupa",
            "appName": "Lookbook",
            "webDir": "../www",
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android
          cp -r ../assets ./assets
          npx capacitor-assets generate --android --iconBackgroundColor "#7c3aed" --splashBackgroundColor "#ffffff"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Assinatura fixa (para atualizar sem apagar as peças)
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            # aceita base64 puro ou a saída do certutil do Windows (linhas -----BEGIN/END-----)
            printf '%s' "$KS" | grep -v -- '-----' | tr -d ' \r\n\t' | base64 -d > ~/.android/debug.keystore
            if keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
              echo "usando a chave fixa do repositório"
            else
              echo "::error::O segredo ANDROID_DEBUG_KEYSTORE_B64 não é uma chave válida (senha android, alias androiddebugkey)"; exit 1
            fi
          else
            echo "::warning::Sem o segredo ANDROID_DEBUG_KEYSTORE_B64: o APK sai com chave nova e não atualiza por cima"
          fi

      - name: Número de versão
        run: |
          f=cap/android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" $f
          grep -E "versionCode|versionName" $f

      - name: Compilar APK
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/lookbook.apk"
          echo "Impressão digital da assinatura (deve ser sempre a mesma):"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$GITHUB_WORKSPACE/lookbook.apk" | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: lookbook-apk
          path: lookbook.apk

      - name: Publicar na página de releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Lookbook para Android (última versão)
          body: Baixe o arquivo lookbook.apk no celular Android e abra para instalar.
          files: lookbook.apk
          make_latest: true
