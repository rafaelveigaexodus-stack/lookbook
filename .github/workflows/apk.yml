# Gera o APK do Lookbook (Android) a cada atualização na main.
# O endereço do servidor da IA vem da variável do repositório API_URL (Settings > Secrets and variables > Actions > Variables).
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar o app web
        env:
          API_URL: ${{ vars.API_URL }}
          APP_CODE: ${{ vars.APP_CODE }}
        run: |
          python3 tools/build.py
          rm -rf www && mkdir www && cp -r public/* www/
          rm -f www/sw.js
          echo "window.LOOKBOOK_CONFIG = {apiBase: \"${API_URL:-https://lookbook-app-zcq4.onrender.com}\", appCode: \"${APP_CODE:-lookbook}\", aiOnDemand: true};" > www/config.js

      - name: Criar projeto Android (Capacitor)
        run: |
          mkdir -p cap && cd cap
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "app.lookbook.guardaroupa",
            "appName": "Lookbook",
            "webDir": "../www",
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android
          cp -r ../assets ./assets
          npx capacitor-assets generate --android --iconBackgroundColor "#7c3aed" --splashBackgroundColor "#ffffff"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compilar APK
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/lookbook.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lookbook-apk
          path: lookbook.apk

      - name: Publicar na página de releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Lookbook para Android (última versão)
          body: Baixe o arquivo lookbook.apk no celular Android e abra para instalar.
          files: lookbook.apk
          make_latest: true
